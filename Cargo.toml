[package]
name = "rusttube"
version = "1.1.0"
edition = "2021"
description = "A fast, native YouTube client for macOS and Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
wry = "0.57"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
