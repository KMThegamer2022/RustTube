name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rusttube-macos-${{ matrix.os }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: |
          # Static CRT so the exe needs no Visual C++ redistributable.
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory dist-win -Force | Out-Null
          Copy-Item target\release\rusttube.exe dist-win\
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$ver /DSRCDIR="$PWD\dist-win" packaging\windows\installer.nsi
          Move-Item packaging\windows\RustTube-*-setup.exe . -Force

      - uses: actions/upload-artifact@v4
        with:
          name: rusttube-windows
          path: RustTube-*-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
